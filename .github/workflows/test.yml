name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install test tools
        run: python -m pip install --quiet pytest ruff==0.15.14
      - name: Lint
        run: ruff check --no-cache src tests
      - name: Test
        env:
          CRUCIBLE_SANDBOX_RO_PATHS: ${{ env.pythonLocation }}
        run: python -m pytest -v
